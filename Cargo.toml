[package]
name = "turbovec-grpc"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "A gRPC server for the turbovec vector index"
license = "MIT"
repository = "https://github.com/ai-pipestream/turbovec-grpc"
keywords = ["vector-search", "grpc", "quantization", "nearest-neighbor", "turboquant"]
categories = ["algorithms", "network-programming"]

[[bin]]
name = "turbovec-grpc"
path = "src/main.rs"

[[bin]]
name = "turbovec-coordinator"
path = "src/coordinator_main.rs"

[dependencies]
turbovec = { git = "https://github.com/RyanCodrai/turbovec", rev = "714b7e128bd7fbe6d4c72c548e1724267483076d" }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic-health = "0.12"
tonic-reflection = "0.12"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-build = "0.12"
