[package]
name = "turbovec-grpc"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A gRPC server for the turbovec vector index"
license = "MIT"
repository = "https://github.com/ai-pipestream/turbovec-grpc"
keywords = ["vector-search", "grpc", "quantization", "nearest-neighbor", "turboquant"]
categories = ["algorithms", "network-programming"]

[[bin]]
name = "turbovec-grpc"
path = "src/main.rs"

[[bin]]
name = "turbovec-coordinator"
path = "src/coordinator_main.rs"

[dependencies]
turbovec = { git = "https://github.com/ai-pipestream/turbovec.git", branch = "turbovec-pipestream-s17" }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "signal"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic-health = "0.12"
tonic-reflection = "0.12"
uuid = { version = "1", features = ["v4"] }
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
# VIBE benchmark harness (examples/vibe-bench): pure-Rust HDF5 reader and an
# HTTPS downloader for the precomputed datasets. Dev-only so the server
# binaries stay lean. hidefix reads the bulk datasets; its `static` feature
# builds the bundled HDF5 C library, so no system libhdf5 is needed. The
# hdf5 crate (same vendored build, already in hidefix's tree) reads the
# root attributes, which hidefix's index API does not expose.
hidefix = { version = "0.11", default-features = false, features = ["static"] }
hdf5 = { version = "0.9", package = "hdf5-metno", default-features = false, features = ["static"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
