name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: clippy,rustfmt
      - run: |
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update && $SUDO apt-get install -y protobuf-compiler cmake pkg-config
      - name: Install buf
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          curl -sSL -o buf "https://github.com/bufbuild/buf/releases/download/v1.70.0/buf-Linux-x86_64"
          chmod +x buf && $SUDO mv buf /usr/local/bin/buf
      - name: Proto drift
        run: |
          cmp proto/turbovec/v1/turbovec.proto clients/python/proto/turbovec/v1/turbovec.proto
          cmp proto/turbovec/v1/coordinator.proto clients/python/proto/turbovec/v1/coordinator.proto
      - name: Proto compat
        run: ./scripts/check-proto-compat.sh origin/main
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --release --locked --test distributed --test smoke

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag turbovec-grpc:test .
